name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate (§6) against the declared mdformat range.
  declared-range:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  # The same gate against mdformat's newest release, outside the declared
  # range, so an upstream change is seen before the bound moves (§2).
  # It does not block a merge.
  newest-mdformat:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]"
      # pip reports the conflict with the declared range and installs anyway.
      - run: python -m pip install --upgrade mdformat
      - run: python -m pip list
      - run: python -m pytest

  # The two checks CLAUDE.md names for DESIGN.md, without this plugin.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "mdformat==1.0.0"
      - run: mdformat --check DESIGN.md
      - run: python -m pip install "mdformat-gfm==1.0.0"
      - run: mdformat --compact-tables --check DESIGN.md
